<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Заявка на букет в магазине Лепесток.">
  <title>Лепесток — заявка</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand text-success" href="index.html">Лепесток</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Открыть меню">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="product.html">Букет</a></li>
          <li class="nav-item"><a class="nav-link active" href="order.html">Заявка</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Главная</a></li>
        <li class="breadcrumb-item active" aria-current="page">Заявка</li>
      </ol>
    </nav>

    <h1 class="h3 mb-3">Заявка на букет</h1>
    <p class="text-secondary">Поля со звёздочкой обязательны. Это учебная форма без отправки на сервер.</p>

    <form class="bg-white border rounded p-4 col-lg-7">
      <div class="mb-3">
        <label for="name" class="form-label">Имя *</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Телефон *</label>
        <input type="tel" class="form-control" id="phone" placeholder="+7 ..." required>
      </div>
      <div class="mb-3">
        <label for="bouquet" class="form-label">Букет</label>
        <select class="form-select" id="bouquet">
          <option>Классика роз</option>
          <option>Тюльпаны</option>
          <option>Весенний микс</option>
          <option>Свой вариант</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Комментарий *</label>
        <textarea class="form-control" id="message" rows="4" required placeholder="Повод, бюджет, адрес"></textarea>
      </div>
      <button type="submit" class="btn btn-success">Отправить</button>
    </form>
  </main>

  <footer class="footer-shop text-white mt-5 py-4">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span>© 2026 Лепесток · КР №2</span>
      <a href="catalog.html">Каталог</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
